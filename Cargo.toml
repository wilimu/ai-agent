[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"

[[example]]
name = "stream_chat"
path = "examples/stream_chat.rs"

[[example]]
name = "tool_call"
path = "examples/tool_call_complete.rs"

[[example]]
name = "agent_loop"
path = "examples/agent_loop.rs"

[[example]]
name = "agent_run"
path = "examples/agent_run.rs"

[[example]]
name = "search_web"
path ="examples/search_web.rs"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41.3", features = ["chat-completion", "embedding"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
backon = "1.6.0"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
reqwest = { version = "0.13.4", features = ["json"] }
rmcp = { version = "3.1.4", features = ["client", "server", "macros", "transport-child-process", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }
