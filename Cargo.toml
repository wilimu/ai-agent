[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"

[[example]]
name = "stream_chat"
path = "examples/stream_chat.rs"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41.3", features = ["chat-completion", "embedding"] }
async-stream = "0.3.6"
backon = "1.6.0"
dotenvy = "0.15.7"
futures = "0.3.34"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
